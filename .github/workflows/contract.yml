name: SwiftJXL migration checks

# Contract 0.5.0 PLAT-01: Swift 6.2 is the manifest minimum and Swift 6.4 the
# qualified primary toolchain, so both are built and tested here. A gate that
# cannot run is an unexecuted gate, not a pass (POL-08), so every job below uses
# a generally available image or runner. No OS 27 job exists because no stable
# runner ships those SDKs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-identity:
    name: Shared contract byte-identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # POL-03 requires the seven shared documents to stay byte-identical across
      # all four repositories. Checking the recorded manifest here catches local
      # drift immediately; cross-repository comparison belongs to the suite
      # harness, which cannot run from inside one repository.
      - name: Verify COMMON_CONTRACT_SHA256.txt matches the documents
        working-directory: Documentation
        run: sha256sum -c COMMON_CONTRACT_SHA256.txt

  linux:
    name: Swift ${{ matrix.swift }} / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        swift: ['6.2', '6.4']
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: swift:${{ matrix.swift }}-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift build
      - run: swift test --no-parallel
      - run: swift build -c release
      - run: swift test -c release --no-parallel
      - name: CLI stream and report checks (debug and release)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv
          python3 -m venv "$RUNNER_TEMP/nrrd-oracle"
          "$RUNNER_TEMP/nrrd-oracle/bin/python" -m pip install --only-binary=:all: -r Scripts/nrrd-oracle-requirements.txt
          swift run --package-path Examples/CLIValidationFixtures CLIValidationFixtures "$RUNNER_TEMP/cli-fixtures"
          python3 Scripts/test-cli-payload.py --binary "$(swift build --show-bin-path)/swiftjxl-cli" --fixtures "$RUNNER_TEMP/cli-fixtures" --output "$RUNNER_TEMP/cli-debug"
          python3 Scripts/test-cli-vardct.py --binary "$(swift build --show-bin-path)/swiftjxl-cli" --output "$RUNNER_TEMP/cli-vardct-debug"
          python3 Scripts/test-cli-vardct-encode.py --binary "$(swift build --show-bin-path)/swiftjxl-cli" --output "$RUNNER_TEMP/cli-vardct-encode-debug"
          python3 Scripts/test-cli-payload.py --binary "$(swift build -c release --show-bin-path)/swiftjxl-cli" --fixtures "$RUNNER_TEMP/cli-fixtures" --output "$RUNNER_TEMP/cli-release"
          python3 Scripts/test-cli-vardct.py --binary "$(swift build -c release --show-bin-path)/swiftjxl-cli" --output "$RUNNER_TEMP/cli-vardct-release"
          python3 Scripts/test-cli-vardct-encode.py --binary "$(swift build -c release --show-bin-path)/swiftjxl-cli" --output "$RUNNER_TEMP/cli-vardct-encode-release"
          "$RUNNER_TEMP/nrrd-oracle/bin/python" Scripts/test-cli-nrrd.py --binary "$(swift build --show-bin-path)/swiftjxl-cli" --fixtures "$RUNNER_TEMP/cli-fixtures" --output "$RUNNER_TEMP/cli-nrrd-debug"
          "$RUNNER_TEMP/nrrd-oracle/bin/python" Scripts/test-cli-nrrd.py --binary "$(swift build -c release --show-bin-path)/swiftjxl-cli" --fixtures "$RUNNER_TEMP/cli-fixtures" --output "$RUNNER_TEMP/cli-nrrd-release"
      - name: Preserve CLI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-${{ matrix.swift }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/cli-*/report.json
          if-no-files-found: warn

  macos-debug:
    name: macOS 26 debug / Swift 6.2
    runs-on: macos-26
    # Keep per-operation deadlines meaningful: CPU-heavy cases run serially,
    # while task-group and worker concurrency inside each case remains tested.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: swift --version
      - run: xcodebuild -version
      - run: swift build
      - run: swift test --no-parallel
      - name: Python for pinned NRRD test oracle
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test-only NRRD oracle
        run: |
          python3 -m venv "$RUNNER_TEMP/nrrd-oracle"
          "$RUNNER_TEMP/nrrd-oracle/bin/python" -m pip install --only-binary=:all: -r Scripts/nrrd-oracle-requirements.txt
      - name: CLI and staged manual installation
        run: python3 Scripts/test-cli.py --binary "$(swift build --show-bin-path)/swiftjxl-cli" --output "$RUNNER_TEMP/cli-evidence"
      - name: CLI supported payloads
        run: |
          swift run --package-path Examples/CLIValidationFixtures CLIValidationFixtures "$RUNNER_TEMP/cli-fixtures"
          python3 Scripts/test-cli-payload.py --binary "$(swift build --show-bin-path)/swiftjxl-cli" --fixtures "$RUNNER_TEMP/cli-fixtures" --output "$RUNNER_TEMP/cli-debug"
          python3 Scripts/test-cli-vardct.py --binary "$(swift build --show-bin-path)/swiftjxl-cli" --output "$RUNNER_TEMP/cli-vardct-debug"
          python3 Scripts/test-cli-vardct-encode.py --binary "$(swift build --show-bin-path)/swiftjxl-cli" --output "$RUNNER_TEMP/cli-vardct-encode-debug"
      - name: NRRD CLI interoperability
        run: '"$RUNNER_TEMP/nrrd-oracle/bin/python" Scripts/test-cli-nrrd.py --binary "$(swift build --show-bin-path)/swiftjxl-cli" --fixtures "$RUNNER_TEMP/cli-fixtures" --output "$RUNNER_TEMP/cli-nrrd-debug"'
      - name: Preserve CLI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-macos
          path: ${{ runner.temp }}/cli-*/report.json
          if-no-files-found: warn

  macos-sanitizers:
    name: macOS 26 ${{ matrix.sanitizer }} sanitizer / Swift 6.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: address
            timeout: 45
          - sanitizer: thread
            timeout: 75
    runs-on: macos-26
    # TSan's complete suite passed in 16 minutes, but serial CLI process checks
    # took the combined job beyond 45 minutes. Individual deadlines stay fixed.
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: swift --version
      - run: xcodebuild -version
      # Each sanitizer retains the complete serial suite and CLI matrix. Split
      # their runner budgets without changing per-operation limits or cases.
      - name: Full sanitizer suite
        # Preserve every assertion/case while optimising instrumented 4097² work.
        # Unoptimised instrumentation previously exhausted the operation budget.
        run: swift test -c release --scratch-path .build/${{ matrix.sanitizer }} --sanitize ${{ matrix.sanitizer }} --no-parallel
      - name: Python for pinned NRRD test oracle
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test-only NRRD oracle
        run: |
          python3 -m venv "$RUNNER_TEMP/nrrd-oracle"
          "$RUNNER_TEMP/nrrd-oracle/bin/python" -m pip install --only-binary=:all: -r Scripts/nrrd-oracle-requirements.txt
      - name: Generate CLI fixtures
        run: swift run --package-path Examples/CLIValidationFixtures CLIValidationFixtures "$RUNNER_TEMP/cli-fixtures"
      - name: CLI sanitizer payload checks
        run: |
          binary="$(swift build -c release --scratch-path .build/${{ matrix.sanitizer }} --show-bin-path)/swiftjxl-cli"
          python3 Scripts/test-cli-payload.py --binary "$binary" --fixtures "$RUNNER_TEMP/cli-fixtures" --output "$RUNNER_TEMP/cli-${{ matrix.sanitizer }}"
      - name: CLI sanitizer VarDCT decode checks
        run: |
          binary="$(swift build -c release --scratch-path .build/${{ matrix.sanitizer }} --show-bin-path)/swiftjxl-cli"
          python3 Scripts/test-cli-vardct.py --binary "$binary" --output "$RUNNER_TEMP/cli-vardct-${{ matrix.sanitizer }}"
      - name: CLI sanitizer VarDCT encode checks
        run: |
          binary="$(swift build -c release --scratch-path .build/${{ matrix.sanitizer }} --show-bin-path)/swiftjxl-cli"
          python3 Scripts/test-cli-vardct-encode.py --binary "$binary" --output "$RUNNER_TEMP/cli-vardct-encode-${{ matrix.sanitizer }}"
      - name: CLI sanitizer NRRD interoperability
        run: |
          binary="$(swift build -c release --scratch-path .build/${{ matrix.sanitizer }} --show-bin-path)/swiftjxl-cli"
          "$RUNNER_TEMP/nrrd-oracle/bin/python" Scripts/test-cli-nrrd.py --binary "$binary" --fixtures "$RUNNER_TEMP/cli-fixtures" --output "$RUNNER_TEMP/cli-nrrd-${{ matrix.sanitizer }}"
      - name: Preserve CLI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-macos-${{ matrix.sanitizer }}
          path: ${{ runner.temp }}/cli-*/report.json
          if-no-files-found: warn

  macos:
    # Preserve the existing check name as an explicit gate over all three jobs.
    name: macOS 26 / Swift 6.2
    needs: [macos-debug, macos-sanitizers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require debug and both sanitizers to pass
        env:
          DEBUG_RESULT: ${{ needs.macos-debug.result }}
          SANITIZER_RESULT: ${{ needs.macos-sanitizers.result }}
        run: |
          test "$DEBUG_RESULT" = success
          test "$SANITIZER_RESULT" = success

  apple-sdk-builds:
    name: Apple OS 26 library SDK builds / Swift 6.2
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Baseline 6.2 uses its native engine explicitly. The separate local 6.4
      # qualification uses Swift Build. Neither command falls back silently.
      - name: Compile every Apple device/simulator library target
        run: python3 Scripts/validate-apple-sdks.py --build-system native --output "$RUNNER_TEMP/apple-sdk-builds"
      - name: Preserve SDK identities, commands and outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple-sdk-builds
          path: |
            ${{ runner.temp }}/apple-sdk-builds/report.json
            ${{ runner.temp }}/apple-sdk-builds/*.log
          if-no-files-found: warn

  independent-consumer:
    name: Independent consumer resolves at tools 6.2
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: package
      # POL-01/POL-02: a consumer must build against this package alone, with no
      # sibling checkout and no suite dependency, on the declared manifest floor.
      - name: Build a fresh consumer against the checkout
        run: |
          set -eux
          NAME="$(grep -m1 -oE 'name: "Swift[A-Z0-9]+"' "$GITHUB_WORKSPACE/package/Package.swift" \
                  | grep -oE 'Swift[A-Z0-9]+')"
          mkdir -p /tmp/consumer/Sources/Consumer
          cd /tmp/consumer
          {
            echo '// swift-tools-version: 6.2'
            echo 'import PackageDescription'
            echo 'let package = Package('
            echo '    name: "Consumer",'
            echo "    dependencies: [.package(path: \"$GITHUB_WORKSPACE/package\")],"
            echo '    targets: [.executableTarget(name: "Consumer", dependencies: ['
            echo "        .product(name: \"$NAME\", package: \"package\")])]"
            echo ')'
          } > Package.swift
          cp "$GITHUB_WORKSPACE/package/Examples/ContractConsumer/Sources/ContractConsumer/Consumer.swift" Sources/Consumer/Consumer.swift
          swift build
          swift run Consumer

  independent-oracle:
    name: Pinned libjxl 0.12.0 interoperability / Swift 6.4
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build pinned test-only reference tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv cmake ninja-build pkg-config libjpeg-dev libjpeg-turbo-progs libpng-dev libbrotli-dev
          git init "$RUNNER_TEMP/libjxl"
          git -C "$RUNNER_TEMP/libjxl" remote add origin https://github.com/libjxl/libjxl.git
          git -C "$RUNNER_TEMP/libjxl" fetch --depth 1 origin a7a9c787341cf703dede03c2009fa460cae5e5df
          git -C "$RUNNER_TEMP/libjxl" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/libjxl" rev-parse HEAD)" = a7a9c787341cf703dede03c2009fa460cae5e5df
          git -C "$RUNNER_TEMP/libjxl" submodule update --init --depth 1 third_party/brotli third_party/highway third_party/lcms
          cmake -S "$RUNNER_TEMP/libjxl" -B "$RUNNER_TEMP/libjxl/build" -G Ninja \
            -DCMAKE_PROJECT_INCLUDE="$GITHUB_WORKSPACE/Scripts/TestSupport/modular-info-oracle.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_SHARED_LIBS=OFF \
            -DJPEGXL_ENABLE_TOOLS=ON -DJPEGXL_ENABLE_BENCHMARK=OFF \
            -DJPEGXL_ENABLE_EXAMPLES=OFF -DJPEGXL_ENABLE_MANPAGES=OFF \
            -DJPEGXL_ENABLE_DOXYGEN=OFF -DJPEGXL_ENABLE_JNI=OFF \
            -DJPEGXL_ENABLE_SJPEG=OFF -DJPEGXL_ENABLE_OPENEXR=OFF \
            -DJPEGXL_ENABLE_SKCMS=OFF -DJPEGXL_ENABLE_TCMALLOC=OFF -DJPEGXL_BUNDLE_LIBPNG=OFF
          cmake --build "$RUNNER_TEMP/libjxl/build" --target cjxl djxl swiftjxl-modular-info-oracle swiftjxl-modular-profile-oracle swiftjxl-animation-pixel-oracle --parallel 2
          mkdir -p .build
          git -C "$RUNNER_TEMP/libjxl" submodule status > .build/oracle-source-pins.txt
      - name: Require debug and release oracle tests
        run: python3 Scripts/validate-oracle.py --tools "$RUNNER_TEMP/libjxl/build/tools" --output .build/oracle-evidence
      - name: Require extended Modular boundary and interpretation matrix
        run: python3 Scripts/test-modular-completion.py --configuration release --scratch-path .build --oracle-bin "$RUNNER_TEMP/libjxl/build/tools" --profile-oracle "$RUNNER_TEMP/libjxl/build/swiftjxl-modular-profile-oracle" --output .build/modular-completion-evidence
      - name: Require JPEG pixels, containers and CLI animation interoperability
        run: |
          swift build -c release
          clang -Wall -Wextra -Werror Scripts/TestSupport/jpeg-coefficient-oracle.c -ljpeg -o "$RUNNER_TEMP/jpeg-coefficient-oracle"
          djpeg -version 2> .build/jpeg-pixel-oracle-version.txt
          python3 Scripts/test-cli-completion.py --binary "$(swift build -c release --show-bin-path)/swiftjxl-cli" --djpeg /usr/bin/djpeg --animation-oracle "$RUNNER_TEMP/libjxl/build/swiftjxl-animation-pixel-oracle" --coefficient-oracle "$RUNNER_TEMP/jpeg-coefficient-oracle" --output .build/cli-completion-evidence
      - name: Recheck JPEG coefficient snapshots independently
        run: |
          python3 Scripts/validate-jpeg-coefficients.py --oracle "$RUNNER_TEMP/jpeg-coefficient-oracle" --output .build/jpeg-coefficient-evidence
      - name: Recheck JPEG reconstruction-event vectors independently
        run: python3 Scripts/validate-jpeg-events.py --tools "$RUNNER_TEMP/libjxl/build/tools" --coefficient-oracle "$RUNNER_TEMP/jpeg-coefficient-oracle" --output .build/jpeg-event-evidence
      - name: Independently validate native Brotli framing fixtures
        run: python3 Scripts/validate-brotli-framing.py --output .build/brotli-framing-evidence/report.json
      - name: Independently validate compressed Brotli and dictionary fixtures
        run: python3 Scripts/validate-brotli-decoder.py --output .build/brotli-decoder-evidence/report.json
      - name: NRRD and libjxl independent CLI interoperability
        run: |
          python3 -m venv "$RUNNER_TEMP/nrrd-oracle"
          "$RUNNER_TEMP/nrrd-oracle/bin/python" -m pip install --only-binary=:all: -r Scripts/nrrd-oracle-requirements.txt
          swift run --package-path Examples/CLIValidationFixtures CLIValidationFixtures "$RUNNER_TEMP/cli-fixtures"
          "$RUNNER_TEMP/nrrd-oracle/bin/python" Scripts/test-cli-nrrd.py --binary "$(swift build --show-bin-path)/swiftjxl-cli" --fixtures "$RUNNER_TEMP/cli-fixtures" --output .build/nrrd-reference-debug --reference-tools "$RUNNER_TEMP/libjxl/build/tools"
          "$RUNNER_TEMP/nrrd-oracle/bin/python" Scripts/test-cli-nrrd.py --binary "$(swift build -c release --show-bin-path)/swiftjxl-cli" --fixtures "$RUNNER_TEMP/cli-fixtures" --output .build/nrrd-reference-release --reference-tools "$RUNNER_TEMP/libjxl/build/tools"
      - name: Native JPEG CLI independent interoperability
        run: |
          python3 Scripts/test-cli-native-jpeg.py --binary "$(swift build --show-bin-path)/swiftjxl-cli" --output .build/native-jpeg-cli-debug --reference-tools "$RUNNER_TEMP/libjxl/build/tools"
          python3 Scripts/test-cli-native-jpeg.py --binary "$(swift build -c release --show-bin-path)/swiftjxl-cli" --output .build/native-jpeg-cli-release --reference-tools "$RUNNER_TEMP/libjxl/build/tools"
      - name: PNM colour and libjxl independent CLI interoperability
        run: |
          python3 Scripts/test-cli-pnm.py --binary "$(swift build --show-bin-path)/swiftjxl-cli" --info-oracle "$RUNNER_TEMP/libjxl/build/swiftjxl-modular-info-oracle" --reference-tools "$RUNNER_TEMP/libjxl/build/tools" --output .build/pnm-reference-debug
          python3 Scripts/test-cli-pnm.py --binary "$(swift build -c release --show-bin-path)/swiftjxl-cli" --info-oracle "$RUNNER_TEMP/libjxl/build/swiftjxl-modular-info-oracle" --reference-tools "$RUNNER_TEMP/libjxl/build/tools" --output .build/pnm-reference-release
          python3 Scripts/test-cli-low-precision.py --binary "$(swift build --show-bin-path)/swiftjxl-cli" --output .build/low-precision-debug
          python3 Scripts/test-cli-low-precision.py --binary "$(swift build -c release --show-bin-path)/swiftjxl-cli" --output .build/low-precision-release
      - name: Preserve oracle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: independent-oracle-evidence
          path: |
            .build/oracle-evidence
            .build/modular-completion-evidence/report.json
            .build/modular-completion-evidence/tests.xml
            .build/modular-completion-evidence/tests.log
            .build/cli-completion-evidence/report.json
            .build/jpeg-pixel-oracle-version.txt
            .build/oracle-source-pins.txt
            .build/nrrd-reference-*/report.json
            .build/native-jpeg-cli-*/report.json
            .build/pnm-reference-*/report.json
            .build/low-precision-*/report.json
            .build/jpeg-coefficient-evidence/report.json
            .build/brotli-framing-evidence/report.json
            .build/brotli-decoder-evidence/report.json
            .build/jpeg-event-evidence/report.json
          if-no-files-found: warn
